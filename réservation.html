<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Réservation — PIETRA HOTEL</title>
  <style>
    :root{
      --bg1:#0f172a; /* deep navy */
      --bg2:#0ea5a4; /* teal */
      --card:#000;
      --muted:#fff;
      --accent-start:#D4AF37;
      --accent-end:#af002d;
      --radius:14px;
      --maxw:520px;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin-left: 4px;
      min-height:50%;
      background-image: url("img2.jpg");
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0px;
      color:#0b1220;
    }

    .card{
      width:100%;
      max-width:var(--maxw);
      background: linear-gradient(180deg,black,grey);
      border-radius:var(--radius);
      box-shadow: 0 10px 30px rgba(2,6,23,0.45);
      overflow:hidden;
    }

    .hero{
      padding:22px 24px;
      background: linear-gradient(90deg,var(--accent-start), var(--accent-end));
      color:white;
      display:flex;
      gap:12px;
      align-items:center;
    }
    .brand{
      font-weight:700;
      font-size:18px;
      letter-spacing:0.6px;
    }
    .subtitle{font-size:13px; opacity:0.95}

    form{padding:22px; display:grid; gap:14px}

    label{display:block; font-size:13px; color:var(--muted); margin-bottom:6px}
    .row{display:grid; grid-template-columns:1fr 1fr; gap:12px}
    input[type="text"], input[type="tel"], input[type="date"], input[type="time"], input[type="number"], select, textarea{
      width:100%;
      padding:12px 12px;
      border-radius:10px;
      border:1px solid rgba(15,23,42,0.06);
      background:linear-gradient(180deg,#fff,#fbfdff);
      font-size:14px;
      outline:none;
      box-shadow:inset 0 1px 0 rgba(2,6,23,0.02);
    }
    input:focus, select:focus, textarea:focus{border-color:rgba(15,23,42,0.12); box-shadow:0 4px 18px rgba(14,165,164,0.08)}

    .small{font-size:12px; color:var(--muted)}

    .actions{display:flex; gap:10px; align-items:center; justify-content:space-between; margin-top:4px}

    .btn{
      padding:12px 18px;
      border-radius:12px;
      border:0;
      cursor:pointer;
      font-weight:600;
      letter-spacing:0.3px;
    }
    .btn-primary{
      background:linear-gradient(90deg,var(--accent-start), var(--accent-end));
      color:white;
      box-shadow:0 8px 20px rgba(175,0,45,0.18);
    }
    .btn-ghost{background:transparent; color:var(--muted)}

    .note{font-size:12px; color:var(--muted); text-align:right}

    /* Responsive */
    @media (max-width:520px){
      .row{grid-template-columns:1fr}
      .hero{padding:18px}
      form{padding:16px}
    }

    /* Simple modal */
    .modal{
      position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(2,6,23,0.45); visibility:hidden; opacity:0; transition:opacity .18s ease, visibility .18s;
    }
    .modal.open{visibility:visible; opacity:1}
    .modal-card{background:var(--card); border-radius:12px; padding:18px; width:90%; max-width:420px; box-shadow:0 20px 60px rgba(2,6,23,0.5)}
    .modal-card h3{margin:0 0 8px}
    .modal-row{font-size:14px; color:var(--muted); margin-bottom:6px}

  </style>
</head>
<body>
   
      <div class="card" role="region" aria-label="Réservation Pietra Hotel">
    <div class="hero">
          <div>
        <div class="brand">PIETRA HOTEL</div>
        <div class="subtitle">Formulaire de réservation</div>
      </div>
      <div style="margin-left:auto; font-size:13px; opacity:0.95;font-weight:bold">Analakely,<br>Antananarivo,<br>Madagascar</div>
    </div>

    <form id="bookingForm" autocomplete="on">
      <div>
        <label for="name">Votre nom</label>
        <input id="name" name="name" type="text" placeholder="Jean Rakoto" required />
      </div>

      <div>
        <label for="phone">Votre téléphone</label>
        <input id="phone" name="phone" type="tel" placeholder="0341234567" pattern="[0-9+\s-]{6,20}" required />
        <div class="small">Entrez un numéro valide (chiffres, +, espaces ou -).</div>
      </div>

      <div class="row">
        <div>
          <label for="date">Date</label>
          <input id="date" name="date" type="date" required />
        </div>
        <div>
          <label for="time">Heure souhaitée</label>
          <input id="time" name="time" type="time" required />
        </div>
      </div>

      <div>
        <label for="people">Nombre de personnes</label>
        <input id="people" name="people" type="number" min="1" max="20" value="2" required />
      </div>

      <div>
        <label for="notes">Remarques (optionnel)</label>
        <textarea id="notes" name="notes" rows="3" placeholder="Allergies, demande spéciale..."></textarea>
      </div>

      <div class="actions">
        <div class="note">Nous vous contacterons pour confirmer.</div>
        <div style="margin-left:auto; display:flex; gap:8px; align-items:center">
          <button type="reset" class="btn btn-ghost">Effacer</button>
          <button type="submit" class="btn btn-primary">Confirmer</button>
        </div>
      </div>

    </form>

  </div>
            <nav>
                  <a href="index.html"><button type="button" class="btn btn-ghost">Retour</button></a>
      </nav>

  <!-- Modal de confirmation -->
  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-card">
      <h3>Réservation prête</h3>
      <div id="modalContent"></div>
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:12px">
        <button id="closeModal" class="btn btn-ghost">Fermer</button>
      </div>
    </div>
  </div>
</body>
</html>
